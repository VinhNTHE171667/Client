server {
    listen 80;
    server_name api.g52-genspa.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.g52-genspa.xyz;

    ssl_certificate /etc/letsencrypt/live/api.g52-genspa.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.g52-genspa.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://sp-genspa-server-container:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
