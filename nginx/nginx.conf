upstream backend_server {
    server spa_main_server:8080;
}

upstream ai_service {
    server do_an_fa25_api:8000;
}

upstream recommender_service {
    server spa_recommender:8000;
}

server {
    listen 80;
    server_name g52-genspa.xyz www.g52-genspa.xyz;
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    client_max_body_size 50M;

    # API routes to main server
    location /api {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # AI/chatbot routes
    location /ai {
        proxy_pass http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Recommendation service routes
    location /recommendation {
        proxy_pass http://recommender_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend (adjust if you have a separate client build)
    location / {
        # Option 1: serve static files from client/dist
        # root /usr/share/nginx/html;
        # try_files $uri $uri/ /index.html;
        
        # Option 2: proxy to a separate frontend container/service
        # proxy_pass http://frontend_service:3000;
        
        # Temporary: return 404 until frontend is configured
        return 404 "Frontend not configured";
    }
}

