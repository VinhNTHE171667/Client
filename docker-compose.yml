version: '3.8'

services:
  ai:
    image: doannhatminh/ai-api:latest
    container_name: do_an_fa25_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FULL_CONTEXT_DOCS=${FULL_CONTEXT_DOCS}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB}
    # AI depends on milvus for embeddings search; enable if you run milvus
    depends_on:
      - milvus
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: do_an_fa25_milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: do_an_fa25_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: default=http://etcd:2380
      ETCD_NAME: default
    ports:
      - "2379:2379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: do_an_fa25_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    restart: unless-stopped

  recommender:
    image: doannhatminh/ai-recommender:latest
    container_name: spa_recommender
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB}
    restart: unless-stopped
