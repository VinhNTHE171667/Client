version: '3.8'

services:
  mysql:
    image: mysql:9.3.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE:-gen_spa}
    ports:
      - "33061:3306"
    volumes:
      - ./server/mysql-data:/var/lib/mysql
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: do_an_fa25_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - ./minio/data:/data
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: do_an_fa25_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: default=http://etcd:2380
      ETCD_NAME: default
    ports:
      - "2379:2379"
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: do_an_fa25_milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    volumes:
      - ./milvus/db:/var/lib/milvus
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tnl 2>/dev/null | grep 19530 || true"]
      interval: 15s
      timeout: 5s
      retries: 6

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: do_an_fa25_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FULL_CONTEXT_DOCS=${FULL_CONTEXT_DOCS}
      - MYSQL_HOST=${DB_HOST}
      - MYSQL_PORT=${DB_PORT}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DB=${DB_DATABASE}
    volumes:
      - ./ai/app/data:/app/data:ro
      # Uncomment the next line if recommendation backend needs persistent data
      # - ./ai/recommendation/backend/data:/app/backend/data
    depends_on:
      - mysql
      - milvus
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); print('OK'); s.close()" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  recommender:
    build:
      context: ./ai/recommendation
      dockerfile: Dockerfile
    container_name: spa_recommender
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - MYSQL_HOST=${DB_HOST}
      - MYSQL_PORT=${DB_PORT}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DB=${DB_DATABASE}
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); print('OK'); s.close()" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spa_main_server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  init:
    image: python:3.11-slim
    container_name: sp_init
    volumes:
      - ./docker/init:/app
    env_file:
      - .env
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python create_minio_and_milvus.py"
    networks:
      - default
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: spa_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL certificates
      # - ./nginx/ssl:/etc/letsencrypt:ro
      # Uncomment if serving static frontend
      # - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
      - ai
      - recommender
    restart: unless-stopped

networks:
  default:
    name: sp_genspa_net
