version: '3.8'

services:
  # =============================
  # 1️⃣ AI API (NestJS)
  # =============================
  ai:
    image: doannhatminh/ai-api:latest
    container_name: do_an_fa25_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - FULL_CONTEXT_DOCS=/app/app/data/ChiTietDichVu.txt
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB}
      - MILVUS_HOST=${MILVUS_HOST}
      - MILVUS_PORT=${MILVUS_PORT}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION}
    # AI depends on milvus for embeddings search; enable if you run milvus
    depends_on:
      - milvus
    volumes:
      - ./ai/app:/app/app
    restart: unless-stopped

  # =============================
  # 2️⃣ MySQL
  # =============================
  mysql:
    image: mysql:8.0
    container_name: do_an_fa25_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # =============================
  # 3️⃣ Milvus
  # =============================
  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: do_an_fa25_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # =============================
  # 4️⃣ ETCD
  # =============================
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: do_an_fa25_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: default=http://etcd:2380
      ETCD_NAME: default
    ports:
      - "2379:2379"
    restart: unless-stopped

  # =============================
  # 5️⃣ MinIO
  # =============================
  minio:
    image: minio/minio:latest
    container_name: do_an_fa25_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # =============================
  # 6️⃣ Recommender (Python API)
  # =============================
  recommender:
    image: doannhatminh/ai-recommender:latest
    container_name: spa_recommender
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
    ports:
      - "8001:8000"
    depends_on:
      - mysql
    volumes:
      - ./ai/recommendation:/app
    restart: unless-stopped

  # =============================
  # 7️⃣ Main Backend Server (NestJS)
  # =============================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spa_main_server
    env_file:
      - .env
      - ./server/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DB}
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped

# =============================
# 8️⃣ VOLUME STORAGE
# =============================
volumes:
  mysql_data:
  minio_data:
