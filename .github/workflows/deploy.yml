name: Deploy FE + BE to VPS

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
      - "server/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ===========================
      # Checkout code
      # ===========================
      - name: Checkout code
        uses: actions/checkout@v3

      # ===========================
      # Setup Node.js (version 20)
      # ===========================
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # ===========================
      # Build Frontend
      # ===========================
      - name: Install FE dependencies
        working-directory: ./client
        run: npm install

      - name: Build FE
        working-directory: ./client
        run: npm run build
        env:
          VITE_PUBLIC_FE: "https://g52-genspa.xyz"
          VITE_PUBLIC_API: "https://g52-genspa.xyz"
          VITE_CHAT_API_URL: "https://g52-genspa.xyz"
          VITE_RECOMMENDATION_API_URL: "https://g52-genspa.xyz"
          VITE_GEMINI_API_KEY: "AIzaSyBXrLziPsVqLu34HyqWEWnSd7CSxfGmpu0"

      - name: Upload FE to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "client/dist/*"
          target: "/var/www/genspa"
          strip_components: 2

      # ===========================
      # Upload Backend to VPS
      # ===========================
      - name: Upload Backend to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "server/*"
          target: "/var/www/genspa-server"
          strip_components: 1
          rm: true

      # ===========================
      # Install, Build & Start Backend
      # ===========================
      - name: Run BE install, build & restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # ===========================
            # Sử dụng Node 20 trên VPS
            # ===========================
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20 || nvm install 20 && nvm use 20

            cd /var/www/genspa-server

            # ===========================
            # Cài dependencies backend
            # ===========================
            npm install

            # ===========================
            # Build backend
            # ===========================
            npm run clean
            npm run build

            # ===========================
            # Cài PM2 nếu chưa có
            # ===========================
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # ===========================
            # Start / Restart backend
            # ===========================
            pm2 restart genspa-api || pm2 start dist/src/main.js --name "genspa-api"
            pm2 save
