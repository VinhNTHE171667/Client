name: Deploy Frontend to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - master  # Hoặc 'master' tùy tên nhánh chính của bạn
    paths:
      - 'client/**' # Chỉ chạy khi có thay đổi trong thư mục client

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # QUAN TRỌNG: Cài đặt và Build bên trong thư mục 'client'
    - name: Install Dependencies
      working-directory: ./client
      run: npm install

    - name: Build Project
      working-directory: ./client
      # Lưu ý: Trong package.json của bạn, lệnh "build" nên là "vite build" để tránh lỗi check code
      run: npm run build
      env:
        # Biến môi trường trỏ về tên miền thật
        VITE_PUBLIC_FE: "https://g52-genspa.xyz"
        VITE_PUBLIC_API: "https://g52-genspa.xyz"
        VITE_CHAT_API_URL: "https://g52-genspa.xyz"
        VITE_RECOMMENDATION_API_URL: "https://g52-genspa.xyz"
        VITE_GEMINI_API_KEY: "AIzaSyBXrLziPsVqLu34HyqWEWnSd7CSxfGmpu0"

    - name: Copy files via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        # Copy từ thư mục client/dist lên VPS
        source: "client/dist/*"
        target: "/var/www/genspa"
        strip_components: 2 # Số 2 để nó bỏ qua lớp 'client' và 'dist', chỉ lấy ruột bên trong
