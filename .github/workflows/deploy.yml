name: Deploy FE + BE to VPS

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
      - "server/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # ===========================
      # BUILD FRONTEND
      # ===========================
      - name: Install FE dependencies
        working-directory: ./client
        run: npm install

      - name: Build FE
        working-directory: ./client
        run: npm run build
        env:
          VITE_PUBLIC_FE: "https://g52-genspa.xyz"
          VITE_PUBLIC_API: "https://g52-genspa.xyz"
          VITE_CHAT_API_URL: "https://g52-genspa.xyz"
          VITE_RECOMMENDATION_API_URL: "https://g52-genspa.xyz"
          VITE_GEMINI_API_KEY: "AIzaSyBXrLziPsVqLu34HyqWEWnSd7CSxfGmpu0"

      - name: Upload FE to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "client/dist/*"
          target: "/var/www/genspa"
          strip_components: 2

      # ===========================
      # DEPLOY BACKEND
      # ===========================
      - name: Upload Backend to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "server/*"
          target: "/var/www/genspa-server"
          strip_components: 1

      - name: Run BE install & restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/genspa-server
            # Update npm nếu cần
            npm install -g npm@11.6.4 || true
            # Cài PM2 nếu chưa có
            if ! command -v pm2 &> /dev/null
            then
              sudo npm install -g pm2
            fi
            # Cài backend
            npm install --omit=dev
            # Restart hoặc start backend
            npm run build
            pm2 restart genspa-api || pm2 start dist/main.js --name "genspa-api"
